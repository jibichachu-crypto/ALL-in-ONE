<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All in One · Home</title>
    
    <!-- Bootstrap CSS (Local) -->
    <link href="bootstrap-5.0.2-dist/css/bootstrap.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #4F46E5, #7C3AED, #A855F7);
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .home-container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 5rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #f7d875);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { font-size: 1.2rem; color: #d1d5db; margin-bottom: 3rem; }
        .games-grid { display: flex; justify-content: center; gap: 1.5rem; }
        .game-card {
            background: #12171d;
            border: 1px solid #1f2a33;
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            width: 250px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-card:hover { transform: translateY(-10px); border-color: #f7d875; box-shadow: 0 15px 40px rgba(247, 216, 117, 0.2); }
        .game-icon { font-size: 4rem; margin-bottom: 1rem; }
        .game-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: #f7d875; }
        .game-desc { font-size: 0.9rem; color: #6a8a9a; }
        .play-btn {
            margin-top: 1.5rem;
            background: #f7d875;
            color: #0b0f14;
            border: none;
            border-radius: 2rem;
            padding: 0.7rem 2rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:hover { background: #e8b84d; transform: scale(1.05); }
        .login-btn {
            background: #f7d875;
            color: #0b0f14;
            border: none;
            border-radius: 2rem;
            padding: 0.7rem 1.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:hover { background: #e8b84d; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="logo">💎</div>
        <div class="title">All in One</div>
        <div class="subtitle">Entertainment. Games. Rewards.</div>
        
        <div class="games-grid">
            <div class="game-card" onclick="window.location.href='/register.html'">
                <div class="game-icon">🧩</div>
                <div class="game-title">Gem Puzzle</div>
                <div class="game-desc">A classic sliding puzzle game. Bet, play and win rewards.</div>
                <button class="play-btn">Play Now</button>
            </div>
        </div>
        
        <div class="header" style="margin-top: 2rem;">
            <button class="login-btn" onclick="window.location.href='/login.html'">Login</button>
        </div>
    </div>

    <!-- Bootstrap JS (Local) -->
    <script src="bootstrap-5.0.2-dist/js/bootstrap.js"></script>
</body>
</html>
