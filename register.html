<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All in One · Register</title>
    
    <!-- Bootstrap CSS (Local) -->
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #4F46E5, #7C3AED, #A855F7);
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            background: #12171d;
            border-radius: 1.5rem;
            border: 1px solid #1f2a33;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .icon { font-size: 2.8rem; }
        .title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff, #f7d875);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 0.85rem; color: #8ba8b8; margin-top: 0.3rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.8rem; color: #a0b8c8; margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background: #0b0f14;
            border: 1px solid #2a3f4d;
            border-radius: 1rem;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: #f7d875; box-shadow: 0 0 10px rgba(247, 216, 117, 0.2); }
        .full-width { grid-column: span 2; }
        .strength-bar { height: 4px; background: #2a3f4d; border-radius: 2px; margin-top: 5px; transition: 0.3s; }
        .strength-text { font-size: 0.7rem; margin-top: 4px; text-align: right; color: #6a8a9a; }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #f7d875, #e8b84d);
            border: none;
            border-radius: 1rem;
            font-weight: 800;
            font-size: 1.1rem;
            color: #0b0f14;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(247, 216, 117, 0.2);
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(247, 216, 117, 0.4); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message { margin-top: 1rem; text-align: center; font-size: 0.9rem; min-height: 1.5rem; color: #4ade80; font-weight: 600; }
        .message.error { color: #f87171; }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #8ba8b8; }
        .login-link a { color: #f7d875; text-decoration: none; font-weight: 700; }
        .footer { text-align: center; font-size: 0.65rem; color: #2a4555; margin-top: 2rem; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="header">
        <div class="icon">💎</div>
        <div class="title">All in One</div>
        <div class="subtitle">Advanced Secure Registration</div>
    </div>

    <form id="registerForm">
        <div class="form-grid">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" required />
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" required />
            </div>
            
            <div class="form-group full-width">
                <label>Email</label>
                <input type="email" id="email" required />
            </div>

            <div class="form-group full-width">
                <label>Phone</label>
                <input type="tel" id="phone" required />
            </div>

            <div class="form-group full-width">
                <label>Password</label>
                <input type="password" id="password" required />
                <div class="strength-bar" id="strengthBar"></div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group full-width">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" required />
                <div class="message" id="confirmMessage"></div>
            </div>
        </div>

        <button type="submit" class="auth-btn" id="registerBtn">📝 Register</button>
        <div class="message" id="registerMessage"></div>
    </form>

    <div class="login-link">
        Already have an account? <a href="/login.html">Login here</a>
    </div>
    <div class="footer">ALL IN ONE · SECURE SYSTEM v2.0</div>
</div>

<!-- Bootstrap JS (Local) -->
<script src="bootstrap-5.0.2-dist/js/bootstrap.js"></script>

<script>
    (function() {
        "use strict";
        
        const API_URL = 'https://localhost:3002';

        const form = document.getElementById('registerForm');
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const messageEl = document.getElementById('registerMessage');
        const confirmMessage = document.getElementById('confirmMessage');

        // Password Strength Checker (8 to 12 characters)
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        password.addEventListener('input', function() {
            let strength = 0;
            if (password.value.length >= 8 && password.value.length <= 12) strength += 1;
            if (password.value.length >= 10) strength += 1;
            if (/[A-Z]/.test(password.value) && /[a-z]/.test(password.value)) strength += 1;
            if (/[0-9]/.test(password.value)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password.value)) strength += 1;

            const colors = ['#f87171', '#f87171', '#fbbf24', '#4ade80', '#22d3ee', '#a78bfa'];
            const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong', 'Elite'];

            strengthBar.style.width = (strength * 20) + '%';
            strengthBar.style.backgroundColor = colors[strength];
            strengthText.textContent = labels[strength] + ' Password (8-12 chars)';
        });

        // Confirm Password Checker
        confirmPassword.addEventListener('input', function() {
            if (confirmPassword.value !== password.value) {
                confirmMessage.textContent = 'Password mismatch';
                confirmMessage.className = 'message error';
            } else {
                confirmMessage.textContent = 'Password matched';
                confirmMessage.className = 'message';
            }
        });

        // Phone Validation
        function validatePhone() {
            return phone.value.trim().length >= 10;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageEl.className = 'message';
            messageEl.textContent = 'Verifying & Registering...';
            registerBtn.disabled = true;

            // Password Validation (8-12 characters)
            if (password.value.length < 8 || password.value.length > 12) {
                messageEl.textContent = 'Password must be between 8 and 12 characters';
                messageEl.className = 'message error';
                registerBtn.disabled = false;
                return;
            }

            // Confirm Password Check
            if (confirmPassword.value !== password.value) {
                messageEl.textContent = 'Password mismatch';
                messageEl.className = 'message error';
                registerBtn.disabled = false;
                return;
            }

            // Phone Validation
            if (!validatePhone()) {
                messageEl.textContent = 'Invalid phone number!';
                messageEl.className = 'message error';
                registerBtn.disabled = false;
                return;
            }

            const payload = {
                firstName: firstName.value.trim(),
                lastName: lastName.value.trim(),
                email: email.value.trim(),
                phone: phone.value.trim(),
                password: password.value
            };

            try {
                const res = await fetch(API_URL + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    messageEl.textContent = 'Registration Successful! Redirecting to Login...';
                    messageEl.className = 'message';
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    messageEl.textContent = data.message;
                    messageEl.className = 'message error';
                    registerBtn.disabled = false;
                }
            } catch (err) {
                messageEl.textContent = 'Server error. Please try again.';
                messageEl.className = 'message error';
                registerBtn.disabled = false;
            }
        });
    })();
</script>
</body>
</html>
