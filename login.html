<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All in One · Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #0a0c0f;
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
        }
        .auth-container {
            max-width: 400px;
            width: 100%;
            background: #12171d;
            border-radius: 2.5rem;
            border: 1px solid #1f2a33;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .icon { font-size: 2.5rem; }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7d875, #f0b84d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 0.85rem; color: #6a8a9a; margin-top: 0.3rem; }
        .method-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; background: #0b0f14; padding: 0.3rem; border-radius: 2rem; }
        .method-btn {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: none;
            border-radius: 1.5rem;
            color: #6a8a9a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .method-btn.active { background: #2a4055; color: #fff; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; color: #6a8a9a; margin-bottom: 0.3rem; }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #0b0f14;
            border: 1px solid #1f2a33;
            border-radius: 2rem;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }
        .form-group input:focus { border-color: #4a7a9a; }
        .auth-btn {
            width: 100%;
            padding: 0.7rem;
            background: linear-gradient(135deg, #f7d875, #e8b84d);
            border: none;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: #0b0f14;
            cursor: pointer;
            transition: 0.25s;
        }
        .auth-btn:hover { transform: scale(1.02); }
        .message { margin-top: 1rem; text-align: center; font-size: 0.9rem; min-height: 1.5rem; color: #4ade80; }
        .message.error { color: #f87171; }
        .register-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #8ba8b8; }
        .register-link a { color: #f7d875; text-decoration: none; font-weight: 700; }
        .footer { text-align: center; font-size: 0.6rem; color: #2a4555; margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="header">
        <div class="icon">💎</div>
        <div class="title">All in One</div>
        <div class="subtitle">Login to start playing</div>
    </div>

    <!-- Google Login Button -->
    <div class="google-btn" id="googleLoginBtn" style="background: #fff; border-radius: 2rem; padding: 0.7rem; margin-bottom: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; cursor: pointer; font-weight: 700; color: #333;">
        <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Sign in with Google</span>
    </div>

    <div class="divider" style="text-align: center; margin: 1rem 0; font-size: 0.8rem; color: #6a8a9a;">
        <span>or</span>
    </div>

    <div class="method-bar">
        <button class="method-btn active" id="usernameMethodBtn">👤 Username</button>
        <button class="method-btn" id="emailMethodBtn">📧 Email</button>
    </div>

    <div class="form-group">
        <label id="loginIdLabel">Username</label>
        <input type="text" id="loginId" placeholder="Enter username or email" />
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
    </div>
    <button class="auth-btn" id="loginBtn">🔑 Login</button>
    <div class="message" id="loginMessage"></div>

    <div class="register-link">
        Don't have an account? <a href="/register.html">Register here</a>
    </div>
    <div class="footer">All in One · Secure Login</div>
</div>

<script>
    (function() {
        "use strict";
        
        const API_URL = 'https://localhost:3002'; 

        const methodBtns = document.querySelectorAll('.method-btn');
        const loginId = document.getElementById('loginId');
        const loginIdLabel = document.getElementById('loginIdLabel');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMessage = document.getElementById('loginMessage');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // Google Login
        googleLoginBtn.addEventListener('click', async function() {
            loginMessage.textContent = 'Google Login is being set up...';
            loginMessage.className = 'message error';
            // നിങ്ങളുടെ Google OAuth Client ID ഇവിടെ ഉപയോഗിച്ച് കോഡ് എഴുതണം
        });

        methodBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                methodBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                if (this.id === 'usernameMethodBtn') {
                    loginIdLabel.textContent = 'Username';
                    loginId.placeholder = 'Enter username';
                    loginId.type = 'text';
                    loginId.value = '';
                } else {
                    loginIdLabel.textContent = 'Email';
                    loginId.placeholder = 'Enter email address';
                    loginId.type = 'email';
                    loginId.value = '';
                }
            });
        });

        loginBtn.addEventListener('click', async function() {
            const identifier = loginId.value.trim();
            const password = loginPassword.value.trim();
            
            if (!identifier || !password) {
                loginMessage.textContent = 'Please fill all fields';
                loginMessage.className = 'message error';
                return;
            }

            const isEmailLogin = document.getElementById('emailMethodBtn').classList.contains('active');
            const payload = isEmailLogin 
                ? { email: identifier, password } 
                : { username: identifier, password };

            try {
                const res = await fetch(API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    loginMessage.textContent = '✅ Login successful! Redirecting to Game...';
                    loginMessage.className = 'message';
                    
                    localStorage.setItem('username', identifier);
                    
                    setTimeout(() => {
                        window.location.href = '/game.html';
                    }, 1000);
                } else {
                    loginMessage.textContent = '❌ ' + data.message;
                    loginMessage.className = 'message error';
                }
            } catch (err) {
                loginMessage.textContent = '❌ Server error. Please try again.';
                loginMessage.className = 'message error';
            }
        });

        loginPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });
    })();
</script>
</body>
</html>
